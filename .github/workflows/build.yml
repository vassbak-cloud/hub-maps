name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore signing key
        run: base64 -d keystore.b64 > hud.keystore

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |What went wrong|^> |error:|Could not" -A3 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"

      - name: Rename APK
        run: cp build/outputs/apk/release/*.apk hud-maps.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: HUD Maps ${{ github.run_number }}
          files: hud-maps.apk
          make_latest: true
